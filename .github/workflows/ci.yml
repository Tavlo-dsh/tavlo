name: ci

# 平时推送的守门检查：不产出安装包，只保证能编译、测试能过。
# 发版由 release.yml 负责（推 v* 标签触发）。
on:
  push:
    branches: [master]
    # 纯文档改动不跑：.trellis 笔记和 markdown 不影响构建
    paths-ignore:
      - "**.md"
      - ".trellis/**"
  pull_request:

# 同一分支连续推送时，取消还在跑的旧任务，避免排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Host
        run: pnpm build:host
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test

  shell:
    name: Shell (cargo test)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # 壳只依赖 ../native-ui 静态页（frontendDist），不需要 Host 产物和 vendor/runtimes；
      # cargo test 已经编译 lib 与 bin，不需要再单独 cargo check
      - name: Cargo test
        run: cargo test
        working-directory: src-tauri
